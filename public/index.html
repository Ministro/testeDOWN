<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Teste</title>

</head>

<body>

<button onclick="consultar()">

Consultar YouTube

</button>

<pre id="resultado"></pre>

<script>

async function consultar(){

    const r = await fetch("/status");

    const json = await r.json();

    document.getElementById("resultado").textContent =
        JSON.stringify(json,null,4);

}

</script>

</body>

</html>
